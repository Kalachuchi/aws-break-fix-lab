<!doctype html>
<html>
<head>
  <title>Incident Log</title>
</head>
<body>
  <h1>Incident Log</h1>
  <form id="form">
    <input id="title" placeholder="Incident title" required>
    <button type="submit">Log incident</button>
  </form>
  <ul id="list"></ul>

  <script>
    const API_URL = "https://hcyf1vav0g.execute-api.us-east-1.amazonaws.com";

    async function loadIncidents() {
      const res = await fetch(API_URL + "/incidents");
      const incidents = await res.json();

      const list = document.getElementById("list");
      for (const incident of incidents) {
        const li = document.createElement("li");
        const date = incident.created_at
          ? new Date(incident.created_at).toLocaleString()
          : "no date";
        li.textContent = date + " - " + incident.title;
        list.append(li);
      }
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;

      await fetch(API_URL + "/incidents", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title })
      });

      document.getElementById("title").value = "";
      document.getElementById("list").innerHTML = "";
      loadIncidents();
    });

    loadIncidents();
  </script>
</body>
</html>
